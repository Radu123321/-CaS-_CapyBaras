<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SECURITY: Content Security Policy to prevent XSS -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self'; 
                 style-src 'self' 'unsafe-inline'; 
                 img-src 'self' data:; 
                 connect-src 'self' ws://localhost:* http://localhost:*;
                 font-src 'self';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'self';">
  
  <!-- SECURITY: Additional headers are set at server level -->
  
  <title>Login - CaS Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Auth buttons only - no header -->
  <div class="auth-only-buttons">
    <div class="guest-only">
      <a href="login.html" class="btn active">Login</a>
      <a href="register.html" class="btn">Register</a>
    </div>
    <div class="auth-required">
      <span class="user-welcome">Bun venit, <span class="user-name"></span>!</span>
      <button onclick="authManager.logout()" class="btn logout-btn">Logout</button>
    </div>
  </div>

  <main class="auth-main">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Autentificare</h1>
          <p>Conectează-te la contul tău CaS</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              placeholder="exemplu@email.com"
              autocomplete="email"
            >
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="password">Parolă</label>
            <div class="password-input">
              <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                placeholder="Introdu parola"
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" id="togglePassword">
                <span class="eye-icon">👁️</span>
              </button>
            </div>
            <span class="error-message" id="passwordError"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span class="checkmark"></span>
              Ține-mă conectat
            </label>
            <a href="forgot-password.html" class="forgot-link">Ai uitat parola?</a>
          </div>

          <button type="submit" class="auth-btn" id="loginBtn">
            <span class="btn-text">Autentificare</span>
            <span class="btn-loading">
              <span class="spinner"></span> Se conectează...
            </span>
          </button>

          <div class="form-divider">
            <span>sau</span>
          </div>

          <div class="social-login">
            <button type="button" class="social-btn google-btn" disabled>
              <span class="social-icon">🔗</span>
              Google (În curând)
            </button>
          </div>

          <div class="auth-footer">
            <p>Nu ai cont? <a href="register.html">Înregistrează-te aici</a></p>
          </div>
        </form>

        <!-- Success/Error Messages -->
        <div id="alertContainer" class="alert-container">
          <div id="alertMessage" class="alert"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Load scripts in correct order -->
  <script src="js/auth.js"></script>
  <script src="js/page-init.js"></script>
  <script src="js/login.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
