<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programări - CaS</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/appointments.css">
</head>
<body>
  <div class="appointments-container">
    <!-- Header -->
    <div class="appointments-header">
      <h1 class="appointments-title">Programări</h1>
      <div class="appointments-actions">
        <a href="calendar.html" class="btn-calendar">
          📅 Calendar
        </a>
        <button class="btn-new-appointment" onclick="appointments.showNewAppointmentModal()">
          ➕ Programare Nouă
        </button>
      </div>
    </div>

    <!-- Statistics -->
    <div class="appointments-stats" id="appointmentsStats">
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <span class="stat-number" id="totalAppointments">-</span>
        <div class="stat-label">Total Programări</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <span class="stat-number" id="pendingAppointments">-</span>
        <div class="stat-label">În Așteptare</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <span class="stat-number" id="confirmedAppointments">-</span>
        <div class="stat-label">Confirmate</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🚀</div>
        <span class="stat-number" id="todayAppointments">-</span>
        <div class="stat-label">Astăzi</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="appointments-filters">
      <div class="filters-grid">
        <div class="form-group">
          <label class="form-label" for="statusFilter">Status</label>
          <select id="statusFilter" class="form-select">
            <option value="">Toate</option>
            <option value="pending">În Așteptare</option>
            <option value="confirmed">Confirmate</option>
            <option value="cancelled">Anulate</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="dateFromFilter">De la</label>
          <input type="date" id="dateFromFilter" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="dateToFilter">Până la</label>
          <input type="date" id="dateToFilter" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="customerFilter">Client</label>
          <select id="customerFilter" class="form-select">
            <option value="">Toți Clienții</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="serviceFilter">Serviciu</label>
          <select id="serviceFilter" class="form-select">
            <option value="">Toate Serviciile</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="locationFilter">Locație</label>
          <select id="locationFilter" class="form-select">
            <option value="">Toate Locațiile</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Appointments Grid -->
    <div id="appointmentsGrid" class="appointments-grid"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-state-icon">📅</div>
      <h3 class="empty-state-title">Nu există programări</h3>
      <p class="empty-state-text">Nu am găsit nicio programare care să corespundă criteriilor selectate.</p>
      <button class="btn-new-appointment" onclick="appointments.showNewAppointmentModal()">
        ➕ Adaugă Programare Nouă
      </button>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- New Appointment Modal -->
  <div id="appointmentModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="appointmentModalTitle">Programare Nouă</h3>
        <button class="modal-close" onclick="appointments.closeAppointmentModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="appointmentForm">
          <div class="form-group">
            <label class="form-label" for="appointmentTitle">Titlu *</label>
            <input type="text" id="appointmentTitle" class="form-input" required placeholder="Ex: Curățenie apartament">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="appointmentDate">Data *</label>
              <input type="date" id="appointmentDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="appointmentTime">Ora *</label>
              <input type="time" id="appointmentTime" class="form-input" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="appointmentCustomer">Client *</label>
              <select id="appointmentCustomer" class="form-select" required>
                <option value="">Selectează clientul</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="appointmentService">Serviciu *</label>
              <select id="appointmentService" class="form-select" required>
                <option value="">Selectează serviciul</option>
              </select>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="appointmentLocation">Locație *</label>
              <select id="appointmentLocation" class="form-select" required>
                <option value="">Selectează locația</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="appointmentEmployee">Angajat</label>
              <select id="appointmentEmployee" class="form-select">
                <option value="">Selectează angajatul</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="appointmentDescription">Descriere</label>
            <textarea id="appointmentDescription" class="form-input" rows="3" placeholder="Detalii suplimentare despre programare..."></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">
              <input type="checkbox" id="appointmentRecurring"> Programare recurentă
            </label>
            <div id="recurringOptions" class="recurring-options">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="recurringFrequency">Frecvență</label>
                  <select id="recurringFrequency" class="form-select">
                    <option value="weekly">Săptămânal</option>
                    <option value="biweekly">La două săptămâni</option>
                    <option value="monthly">Lunar</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="recurringCount">Repetări</label>
                  <input type="number" id="recurringCount" class="form-input" min="1" max="12" value="4">
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="appointments.closeAppointmentModal()">
          Anulează
        </button>
        <button type="button" class="btn btn-primary" onclick="appointments.saveAppointment()">
          Salvează
        </button>
      </div>
    </div>
  </div>

  <!-- Appointment Details Modal -->
  <div id="appointmentDetailsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="appointmentDetailsTitle">Detalii Programare</h3>
        <button class="modal-close" onclick="appointments.closeDetailsModal()">&times;</button>
      </div>
      <div class="modal-body" id="appointmentDetailsBody">
        <!-- Details will be populated here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="cancelAppointmentBtn" onclick="appointments.cancelAppointment()">
          Anulează Programarea
        </button>
        <button type="button" class="btn btn-secondary" onclick="appointments.closeDetailsModal()">
          Închide
        </button>
        <button type="button" class="btn btn-primary" id="editAppointmentBtn" onclick="appointments.editAppointment()">
          Editează
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Load scripts in correct order -->
  <script src="js/auth.js"></script>
  <script src="js/page-init.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
