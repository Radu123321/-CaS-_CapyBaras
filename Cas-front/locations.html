<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locații - CaS Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <main class="dashboard-main">
    <!-- Loading State -->
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Se încarcă locațiile...</p>
    </div>

    <!-- Locations Content -->
    <div id="locationsContent" class="dashboard-content" style="display: none;">
      
      <!-- Header Section -->
      <section class="page-header">
        <div class="header-content">
          <div class="header-info">
            <h1>Gestionare Locații</h1>
            <p>Administrează toate locațiile CaS</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-success" onclick="showAddLocationModal()">
              <span>➕</span> Locație Nouă
            </button>
            <button class="btn btn-secondary" onclick="refreshLocations()">
              <span>🔄</span> Reîmprospătează
            </button>
            <a href="dashboard.html" class="btn btn-outline">
              <span>←</span> Înapoi la Dashboard
            </a>
          </div>
        </div>
      </section>

      <!-- Locations Dashboard -->
      <section class="locations-dashboard">
        <div class="dashboard-cards">
          <div class="stat-card">
            <div class="stat-icon">🏢</div>
            <div class="stat-info">
              <h3 id="totalLocations">0</h3>
              <p>Total Locații</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Locations Grid -->
      <section class="locations-section">
        <div class="locations-grid" id="locationsGrid">
          <!-- Location cards will be populated here -->
        </div>
      </section>

    </div>

    <!-- Error State -->
    <div id="errorState" class="error-state" style="display: none;">
      <div class="error-card">
        <h2>Eroare la încărcarea locațiilor</h2>
        <p id="errorMessage">A apărut o eroare neașteptată.</p>
        <button class="btn" onclick="location.reload()">Reîncarcă Pagina</button>
      </div>
    </div>

  </main>

  <!-- Add Location Modal -->
  <div id="addLocationModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Locație Nouă</h3>
        <button class="modal-close" onclick="closeAddLocationModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addLocationForm">
          <div class="form-group">
            <label for="locationName">Nume locație *</label>
            <input type="text" id="locationName" required placeholder="Ex: CaS Centrul Vechi">
          </div>
          <div class="form-group">
            <label for="locationAddress">Adresă *</label>
            <input type="text" id="locationAddress" required placeholder="Strada, numărul, sector">
          </div>
          <div class="form-group">
            <label for="locationCity">Oraș *</label>
            <input type="text" id="locationCity" required placeholder="București">
          </div>
          <div class="form-group">
            <label for="locationPhone">Telefon</label>
            <input type="tel" id="locationPhone" placeholder="021.XXX.XXXX">
          </div>
          <div class="form-group">
            <label for="locationEmail">Email</label>
            <input type="email" id="locationEmail" placeholder="locatie@cas.ro">
          </div>
          <div class="form-group">
            <label for="locationNotes">Observații</label>
            <textarea id="locationNotes" rows="3" placeholder="Informații suplimentare..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddLocationModal()">Anulează</button>
        <button class="btn btn-primary" onclick="addLocation()">Adaugă Locația</button>
      </div>
    </div>
  </div>

  <!-- Location Details Modal -->
  <div id="locationDetailsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="locationDetailsTitle">Detalii Locație</h3>
        <button class="modal-close" onclick="closeLocationDetailsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="locationDetailsContent">
          <!-- Location details will be loaded here -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeLocationDetailsModal()">Închide</button>
        <button class="btn btn-primary" onclick="editLocation()">Editează</button>
      </div>
    </div>
  </div>

  <!-- Edit Location Modal -->
  <div id="editLocationModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editează Locația</h3>
        <button class="modal-close" onclick="locationsManager.closeEditLocationModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editLocationForm">
          <div class="form-group">
            <label for="editLocationName">Nume locație *</label>
            <input type="text" id="editLocationName" required>
          </div>
          <div class="form-group">
            <label for="editLocationAddress">Adresă *</label>
            <input type="text" id="editLocationAddress" required>
          </div>
          <div class="form-group">
            <label for="editLocationCity">Oraș *</label>
            <input type="text" id="editLocationCity" required>
          </div>
          <div class="form-group">
            <label for="editLocationPhone">Telefon</label>
            <input type="tel" id="editLocationPhone">
          </div>
          <div class="form-group">
            <label for="editLocationEmail">Email</label>
            <input type="email" id="editLocationEmail">
          </div>
          <div class="form-group">
            <label for="editLocationNotes">Observații</label>
            <textarea id="editLocationNotes" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="locationsManager.closeEditLocationModal()">Anulează</button>
        <button class="btn btn-primary" onclick="locationsManager.editLocation()">Salvează</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/locations.js"></script>
  <!-- AuthManager instantiated in js/auth.js -->
</body>
</html>
