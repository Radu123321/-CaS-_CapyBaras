<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - CaS Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
  <div class="calendar-container">
    <!-- Header -->
    <div class="calendar-header">
      <div class="calendar-nav">
        <button id="prevBtn" onclick="calendar.previousPeriod()">‹</button>
        <button id="todayBtn" onclick="calendar.goToToday()">Astăzi</button>
        <button id="nextBtn" onclick="calendar.nextPeriod()">›</button>
        <button id="refreshBtn" onclick="calendar.forceReload()" title="Reîmprospătează datele">🔄</button>
        <h2 class="calendar-title" id="calendarTitle">Ianuarie 2025</h2>
      </div>
      
      <div class="calendar-actions">
        <div class="calendar-view-toggle">
          <button class="view-btn active" data-view="month">Lună</button>
          <button class="view-btn" data-view="week">Săptămână</button>
          <button class="view-btn" data-view="day">Zi</button>
        </div>
        <button class="btn-new-appointment" onclick="calendar.showNewAppointmentModal()">
          + Programare Nouă
        </button>
      </div>
    </div>

    <!-- Month View -->
    <div id="monthView" class="month-view">
      <div class="calendar-grid" id="calendarGrid">
        <!-- Calendar will be generated here -->
      </div>
    </div>

    <!-- Week View -->
    <div id="weekView" class="week-view">
      <div class="week-header" id="weekHeader">
        <!-- Week header will be generated here -->
      </div>
      <div class="week-body" id="weekBody">
        <!-- Week body will be generated here -->
      </div>
    </div>

    <!-- Day View -->
    <div id="dayView" class="day-view">
      <div class="day-header">
        <h3 class="day-title" id="dayTitle">Luni, 1 Ianuarie 2025</h3>
      </div>
      <div class="day-body" id="dayBody">
        <!-- Day body will be generated here -->
      </div>
    </div>

    <!-- Legend -->
    <div class="calendar-legend">
      <div class="legend-item">
        <div class="legend-color legend-appointment"></div>
        <span>Programări</span>
      </div>
      <div class="legend-item">
        <div class="legend-color legend-maintenance"></div>
        <span>Mentenanță</span>
      </div>
      <div class="legend-item">
        <div class="legend-color legend-order"></div>
        <span>Comenzi</span>
      </div>
      <div class="legend-item">
        <div class="legend-color legend-event"></div>
        <span>Evenimente</span>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- New Appointment Modal -->
  <div id="appointmentModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="appointmentModalTitle">Programare Nouă</h3>
        <button class="modal-close" onclick="calendar.closeAppointmentModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="appointmentForm">
          <div class="form-group">
            <label class="form-label" for="appointmentTitle">Titlu *</label>
            <input type="text" id="appointmentTitle" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="appointmentType">Tip *</label>
            <select id="appointmentType" class="form-select" required>
              <option value="">Selectează tipul</option>
              <option value="appointment">Programare Client</option>
              <option value="maintenance">Mentenanță Echipament</option>
              <option value="meeting">Întâlnire</option>
              <option value="training">Training</option>
              <option value="other">Altele</option>
            </select>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="appointmentDate">Data *</label>
              <input type="date" id="appointmentDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="appointmentTime">Ora *</label>
              <input type="time" id="appointmentTime" class="form-input" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="appointmentDuration">Durată (minute)</label>
            <select id="appointmentDuration" class="form-select">
              <option value="30">30 minute</option>
              <option value="60" selected>1 oră</option>
              <option value="90">1.5 ore</option>
              <option value="120">2 ore</option>
              <option value="180">3 ore</option>
              <option value="240">4 ore</option>
            </select>
          </div>
          
          <div class="form-group" id="customerGroup">
            <label class="form-label" for="appointmentCustomer">Client</label>
            <select id="appointmentCustomer" class="form-select">
              <option value="">Selectează clientul</option>
            </select>
          </div>
          
          <div class="form-group" id="serviceGroup">
            <label class="form-label" for="appointmentService">Serviciu</label>
            <select id="appointmentService" class="form-select">
              <option value="">Selectează serviciul</option>
            </select>
          </div>
          
          <div class="form-group" id="locationGroup">
            <label class="form-label" for="appointmentLocation">Locație</label>
            <select id="appointmentLocation" class="form-select">
              <option value="">Selectează locația</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="appointmentDescription">Descriere</label>
            <textarea id="appointmentDescription" class="form-textarea" rows="3"></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">
              <input type="checkbox" id="appointmentRecurring"> Programare recurentă
            </label>
          </div>
          
          <div id="recurringOptions">
            <div class="form-group">
              <label class="form-label" for="recurringType">Tip recurență</label>
              <select id="recurringType" class="form-select">
                <option value="daily">Zilnic</option>
                <option value="weekly">Săptămânal</option>
                <option value="monthly">Lunar</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="recurringEnd">Data sfârșit</label>
              <input type="date" id="recurringEnd" class="form-input">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="calendar.closeAppointmentModal()">
          Anulează
        </button>
        <button type="button" class="btn btn-primary" onclick="calendar.saveAppointment()">
          Salvează
        </button>
      </div>
    </div>
  </div>

  <!-- Event Details Modal -->
  <div id="eventModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="eventModalTitle">Detalii Eveniment</h3>
        <button class="modal-close" onclick="calendar.closeEventModal()">&times;</button>
      </div>
      <div class="modal-body" id="eventModalBody">
        <!-- Event details will be loaded here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="calendar.closeEventModal()">
          Închide
        </button>
        <button type="button" class="btn btn-danger" onclick="calendar.deleteEvent()" id="deleteEventBtn">
          Șterge
        </button>
        <button type="button" class="btn btn-primary" onclick="calendar.editEvent()" id="editEventBtn">
          Editează
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Load scripts in correct order -->
  <script src="js/auth.js"></script>
  <script src="js/page-init.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
