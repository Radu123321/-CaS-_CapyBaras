<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SECURITY: Content Security Policy to prevent XSS -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline'; 
                 style-src 'self' 'unsafe-inline'; 
                 img-src 'self' data:; 
                 connect-src 'self' ws://localhost:* http://localhost:*;
                 font-src 'self';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'self';">
  
  <!-- SECURITY: Additional headers are set at server level -->
  
  <title>CaS Management - Redirecting...</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <div class="redirect-container">
    <div class="redirect-spinner"></div>
    <div class="redirect-message">Se încarcă...</div>
    <div class="redirect-subtext">Verificăm starea de autentificare</div>
  </div>

  <!-- Load scripts in correct order -->
  <script src="js/auth.js"></script>
  <script src="js/page-init.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
